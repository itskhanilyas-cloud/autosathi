<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoSathi</title>
<meta name="description" content="AutoSathi — book an auto-rickshaw in seconds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffc928'/%3E%3Cpath d='M14 40V26a6 6 0 0 1 6-6h18l10 12v8z' fill='%231b1b1b'/%3E%3Ccircle cx='22' cy='44' r='5' fill='%231b1b1b'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%231b1b1b'/%3E%3C/svg%3E">
<style>
:root{--bg:#fbf8f1;--card:#fff;--ink:#1b1b1b;--muted:#6b6658;--line:#e8e2d3;--brand:#ffc928;--brand-ink:#1b1b1b;--ok:#1f8a4c;--warn:#b5520f}
@media (prefers-color-scheme:dark){:root{--bg:#141310;--card:#1f1d18;--ink:#f3efe4;--muted:#a8a191;--line:#34302700;--line:#353126}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo small{font-weight:500;font-size:12px;display:block;letter-spacing:0;opacity:.75}
.tabs{display:flex;background:rgba(0,0,0,.08);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;color:var(--brand-ink);cursor:pointer}
.tabs button.on{background:#1b1b1b;color:var(--brand)}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#1b1b1b;color:var(--brand);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{background:var(--brand);color:#1b1b1b}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.fare{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.fare b{font-size:24px}
.muted{color:var(--muted);font-size:14px}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li{padding:8px 0 8px 28px;position:relative;color:var(--muted)}
.steps li:before{content:"";position:absolute;left:6px;top:13px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.steps li.done{color:var(--ink)}.steps li.done:before{background:var(--ok);border-color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:700}.steps li.now:before{border-color:var(--brand);background:var(--brand);animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(1.3)}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.req{border-top:1px solid var(--line);padding:12px 0}.req:first-child{border-top:0}
.otp{font-size:28px;letter-spacing:6px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo">AutoSathi<small>Your auto, your sathi</small></div>
  <nav class="tabs" aria-label="Mode">
    <button id="tRider" class="on">Rider</button>
    <button id="tDriver">Driver</button>
  </nav>
</header>

<main>
<!-- RIDER -->
<section id="rider">
  <div class="card" id="bookCard">
    <h2>Book an auto</h2>
    <label for="city">City</label>
    <select id="city"></select>
    <label for="from">Pickup</label>
    <select id="from"></select>
    <label for="to">Drop</label>
    <select id="to"></select>
    <div class="row">
      <div><label for="name">Your name</label><input id="name" placeholder="e.g. Ayesha" autocomplete="name"></div>
      <div><label for="phone">Phone</label><input id="phone" inputmode="tel" placeholder="10-digit mobile" maxlength="10"></div>
    </div>
    <label for="pay">Payment</label>
    <select id="pay"><option>Cash</option><option>UPI</option></select>
    <div class="fare"><span><span class="muted" id="dist">—</span></span><b id="price">₹0</b></div>
    <button class="btn" id="bookBtn">Book auto</button>
    <p class="muted" id="err" role="alert"></p>
  </div>

  <div class="card hidden" id="tripCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Your ride</h2><span class="pill" id="tripPill"></span>
    </div>
    <p class="muted" id="tripRoute"></p>
    <div id="driverBox" class="hidden">
      <p style="margin:6px 0"><b id="dName"></b> · <span id="dAuto"></span></p>
      <p class="muted" style="margin:0">Share this OTP with your driver</p>
      <div class="otp" id="otp"></div>
    </div>
    <ul class="steps" id="steps"></ul>
    <button class="btn ghost" id="cancelBtn">Cancel ride</button>
    <button class="btn hidden" id="newBtn">Book another ride</button>
  </div>

  <div class="card">
    <h2>Ride history</h2>
    <div id="history"></div>
  </div>
</section>

<!-- DRIVER -->
<section id="driver" class="hidden">
  <div class="card">
    <h2>Driver profile</h2>
    <div class="row">
      <div><label for="dn">Name</label><input id="dn" placeholder="e.g. Ramesh"></div>
      <div><label for="dv">Auto number</label><input id="dv" placeholder="MH 12 AB 1234"></div>
    </div>
    <label><input type="checkbox" id="online" style="width:auto;margin-right:8px">Go online to receive rides</label>
  </div>
  <div class="card">
    <h2>Ride requests</h2>
    <div id="requests"></div>
  </div>
  <div class="card">
    <h2>Today's earnings</h2>
    <b id="earn" style="font-size:28px">₹0</b> <span class="muted" id="earnN"></span>
  </div>
</section>
</main>
<footer>AutoSathi demo · rides are stored in this browser · open Driver in another tab to accept rides</footer>

<script>
const CITIES={
  "Mumbai":{"Andheri Station":[19.1197,72.8468],"Bandra Station":[19.0544,72.8402],"Powai":[19.1176,72.906],"Juhu Beach":[19.0988,72.8267],"Ghatkopar":[19.0863,72.9081],"Goregaon":[19.1663,72.8526]},
  "Delhi":{"Connaught Place":[28.6315,77.2167],"Karol Bagh":[28.6519,77.1909],"Lajpat Nagar":[28.5677,77.2433],"Saket":[28.5245,77.2066],"Chandni Chowk":[28.6506,77.2303],"Hauz Khas":[28.5494,77.2001]},
  "Bengaluru":{"MG Road":[12.9756,77.6066],"Koramangala":[12.9352,77.6245],"Indiranagar":[12.9784,77.6408],"Jayanagar":[12.925,77.5938],"Majestic":[12.9767,77.5713],"Whitefield":[12.9698,77.7499]},
  "Pune":{"Shivajinagar":[18.5308,73.8475],"Kothrud":[18.5074,73.8077],"Hinjewadi":[18.5912,73.7389],"Viman Nagar":[18.5679,73.9143],"Swargate":[18.5018,73.8636],"Baner":[18.559,73.7868]}
};
const STEPS=["Searching for a driver","Driver on the way","Ride started","Ride completed"];
const KEY="autosathi.rides.v1",DKEY="autosathi.driver.v1";
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let rides=load(KEY,[]);
let myRideId=load("autosathi.mine",null);

function km(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*1.3;} // 1.3 = road factor
function fare(d){return Math.round(d<=1.5?30:30+(d-1.5)*15);} // ₹30 min for 1.5 km, ₹15/km after

function fillCity(){const c=$("city");c.innerHTML=Object.keys(CITIES).map(x=>`<option>${x}</option>`).join("");fillPlaces();}
function fillPlaces(){const p=Object.keys(CITIES[$("city").value]).map(x=>`<option>${x}</option>`).join("");
  $("from").innerHTML=p;$("to").innerHTML=p;$("to").selectedIndex=1;quote();}
function quote(){const C=CITIES[$("city").value],f=$("from").value,t=$("to").value;
  if(f===t){$("dist").textContent="Pick a different drop";$("price").textContent="₹0";$("bookBtn").disabled=true;return}
  const d=km(C[f],C[t]);$("dist").textContent=`${d.toFixed(1)} km · ~${Math.max(5,Math.round(d*3.5))} min`;
  $("price").textContent="₹"+fare(d);$("bookBtn").disabled=false;}
["city"].forEach(i=>$(i).onchange=fillPlaces);["from","to"].forEach(i=>$(i).onchange=quote);

$("bookBtn").onclick=()=>{
  const name=$("name").value.trim(),phone=$("phone").value.trim();
  if(!name){$("err").textContent="Please enter your name.";return}
  if(!/^[6-9]\d{9}$/.test(phone)){$("err").textContent="Enter a valid 10-digit Indian mobile number.";return}
  $("err").textContent="";
  const C=CITIES[$("city").value],d=km(C[$("from").value],C[$("to").value]);
  const r={id:Date.now().toString(36),city:$("city").value,from:$("from").value,to:$("to").value,km:+d.toFixed(1),fare:fare(d),
    pay:$("pay").value,name,phone,status:0,otp:String(1000+Math.floor(Math.random()*9000)),at:Date.now(),driver:null,cancelled:false};
  rides.unshift(r);save(KEY,rides);myRideId=r.id;save("autosathi.mine",r.id);render();
  // If no driver accepts in 20s, an auto-assigned demo driver picks it up
  setTimeout(()=>autoAssign(r.id),20000);
};
function autoAssign(id){rides=load(KEY,[]);const r=rides.find(x=>x.id===id);
  if(r&&!r.cancelled&&r.status===0){r.driver={name:"Suresh K.",auto:"KA 01 AX 4421"};r.status=1;save(KEY,rides);render();progress(id)}}
function progress(id){ // demo: simulate trip progress once a driver is assigned
  setTimeout(()=>step(id,1,2),12000);setTimeout(()=>step(id,2,3),24000);}
function step(id,from,to){rides=load(KEY,[]);const r=rides.find(x=>x.id===id);if(r&&!r.cancelled&&r.status===from){r.status=to;save(KEY,rides);render()}}
$("cancelBtn").onclick=()=>{const r=rides.find(x=>x.id===myRideId);if(r){r.cancelled=true;save(KEY,rides)}render()};
$("newBtn").onclick=()=>{myRideId=null;save("autosathi.mine",null);render()};

function renderTrip(){
  const r=rides.find(x=>x.id===myRideId);
  $("bookCard").classList.toggle("hidden",!!r);$("tripCard").classList.toggle("hidden",!r);if(!r)return;
  $("tripRoute").textContent=`${r.from} → ${r.to}, ${r.city} · ${r.km} km · ₹${r.fare} (${r.pay})`;
  const done=r.cancelled||r.status===3;
  $("tripPill").textContent=r.cancelled?"Cancelled":STEPS[r.status];$("tripPill").className="pill "+(r.cancelled?"warn":r.status===3?"ok":"");
  $("driverBox").classList.toggle("hidden",!r.driver||done);
  if(r.driver){$("dName").textContent=r.driver.name;$("dAuto").textContent=r.driver.auto;$("otp").textContent=r.otp}
  $("steps").innerHTML=r.cancelled?"":STEPS.map((s,i)=>`<li class="${i<r.status||r.status===3?"done":i===r.status?"now":""}">${s}</li>`).join("");
  $("cancelBtn").classList.toggle("hidden",done||r.status>=2);$("newBtn").classList.toggle("hidden",!done);
}
function renderHistory(){
  const h=rides.filter(r=>r.cancelled||r.status===3);
  $("history").innerHTML=h.length?h.slice(0,8).map(r=>`<div class="req"><b>${esc(r.from)} → ${esc(r.to)}</b><br><span class="muted">${new Date(r.at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})} · ₹${r.fare}</span> <span class="pill ${r.cancelled?"warn":"ok"}">${r.cancelled?"Cancelled":"Completed"}</span></div>`).join(""):`<div class="empty">No rides yet</div>`;
}
// DRIVER
let drv=load(DKEY,{name:"",auto:"",online:false});
$("dn").value=drv.name;$("dv").value=drv.auto;$("online").checked=drv.online;
["dn","dv"].forEach(i=>$(i).oninput=()=>{drv.name=$("dn").value;drv.auto=$("dv").value.toUpperCase();save(DKEY,drv)});
$("online").onchange=()=>{if($("online").checked&&(!drv.name.trim()||!drv.auto.trim())){$("online").checked=false;alertBox("Add your name and auto number first.");return}
  drv.online=$("online").checked;save(DKEY,drv);renderDriver()};
function alertBox(m){$("requests").innerHTML=`<div class="empty">${m}</div>`}
function renderDriver(){
  const mine=rides.filter(r=>r.driver&&r.driver.name===drv.name&&r.driver.auto===drv.auto);
  const paid=mine.filter(r=>r.status===3&&!r.cancelled);
  $("earn").textContent="₹"+paid.reduce((s,r)=>s+r.fare,0);$("earnN").textContent=`${paid.length} ride${paid.length===1?"":"s"}`;
  if(!drv.online){alertBox("You're offline. Go online to see ride requests.");return}
  const active=mine.find(r=>!r.cancelled&&r.status>0&&r.status<3);
  if(active){$("requests").innerHTML=`<div class="req"><span class="pill">${STEPS[active.status]}</span><p><b>${esc(active.name)}</b> · ${esc(active.phone)}<br>${esc(active.from)} → ${esc(active.to)} · ₹${active.fare} (${active.pay})</p>
    ${active.status===1?`<label>Rider's OTP</label><input id="otpIn" inputmode="numeric" maxlength="4"><button class="btn" onclick="startRide('${active.id}')">Start ride</button>`:`<button class="btn" onclick="endRide('${active.id}')">Complete ride · collect ₹${active.fare}</button>`}</div>`;return}
  const open=rides.filter(r=>!r.cancelled&&r.status===0);
  $("requests").innerHTML=open.length?open.map(r=>`<div class="req"><b>${esc(r.from)} → ${esc(r.to)}</b> <span class="pill">${r.city}</span><br><span class="muted">${r.km} km · ${esc(r.name)} · ${r.pay}</span><div class="row"><button class="btn" onclick="accept('${r.id}')">Accept · ₹${r.fare}</button></div></div>`).join(""):`<div class="empty">Waiting for ride requests…</div>`;
}
function accept(id){rides=load(KEY,[]);const r=rides.find(x=>x.id===id);if(!r||r.status!==0||r.cancelled){render();return}
  r.driver={name:drv.name,auto:drv.auto};r.status=1;save(KEY,rides);render()}
function startRide(id){rides=load(KEY,[]);const r=rides.find(x=>x.id===id);
  if($("otpIn").value!==r.otp){$("otpIn").style.borderColor="var(--warn)";$("otpIn").value="";$("otpIn").placeholder="Wrong OTP";return}
  r.status=2;save(KEY,rides);render()}
function endRide(id){rides=load(KEY,[]);const r=rides.find(x=>x.id===id);r.status=3;save(KEY,rides);render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){rides=load(KEY,rides);renderTrip();renderHistory();renderDriver()}
function mode(m){$("rider").classList.toggle("hidden",m!=="rider");$("driver").classList.toggle("hidden",m!=="driver");
  $("tRider").classList.toggle("on",m==="rider");$("tDriver").classList.toggle("on",m==="driver");try{location.hash=m}catch{}}
$("tRider").onclick=()=>mode("rider");$("tDriver").onclick=()=>mode("driver");
window.addEventListener("storage",render); // sync rider & driver tabs live
setInterval(render,3000);
fillCity();mode(location.hash==="#driver"?"driver":"rider");render();
// resume any ride already assigned to a demo driver
const cur=rides.find(x=>x.id===myRideId);if(cur&&!cur.cancelled&&cur.status===0)setTimeout(()=>autoAssign(cur.id),20000);
</script>
</body>
</html>
